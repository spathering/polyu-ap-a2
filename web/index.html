<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07151b" />
    <meta
      name="description"
      content="Interactive Hong Kong temperature and rainfall surfaces for April 2026"
    />
    <title>Hong Kong Weather Surfaces</title>
  </head>
  <body>
    <main id="app" aria-busy="true">
      <div id="viewer" aria-label="Interactive 3D weather surfaces"></div>
      <header class="title-block">
        <h1>Hong Kong Weather Surfaces</h1>
        <p>Rainfall above · temperature below</p>
      </header>
      <div id="date-label" class="date-label">Loading…</div>
      <div class="right-rail">
        <details id="settings" class="settings-panel">
          <summary>Settings</summary>
          <label class="setting-row" for="autoplay">
            <span>Automatic playback</span>
            <input id="autoplay" type="checkbox" checked />
          </label>
        </details>
        <aside class="legend legend-rainfall" aria-label="Rainfall legend">
          <span>Rainfall · baseline 0 mm</span>
          <div class="gradient rainfall-gradient"></div>
          <div class="ticks"><b>0</b><b>33.5</b><b>67 mm</b></div>
        </aside>
        <aside class="legend legend-temperature" aria-label="Temperature legend">
          <span>Temperature · fades near 14 °C</span>
          <div class="gradient temperature-gradient"></div>
          <div class="ticks"><b>14</b><b>21</b><b>28 °C</b></div>
        </aside>
      </div>
      <div id="tooltip" class="tooltip" hidden></div>
      <section class="timeline-shell" aria-label="Date control">
        <input id="timeline" type="range" min="0" max="29" step="0.01" value="0" />
        <div class="timeline-labels"><span>APR 01</span><strong id="timeline-date">01 APR 2026</strong><span>APR 30</span></div>
      </section>
      <footer>
        Reference grid Y = 0 · daily fields and in-between times are estimates
      </footer>
      <div id="loading" class="loading">Preparing 30 weather frames…</div>
      <div id="error" class="error" hidden></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
