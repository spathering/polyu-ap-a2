[project]
name = "hong-kong-weather-surfaces"
version = "0.1.0"
description = "Interactive Hong Kong temperature and rainfall surfaces"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2,<3",
  "Pillow>=11,<13",
  "pyproj>=3.7,<4",
  "pyvista>=0.49,<0.50",
  "requests>=2.32,<3",
  "shapely>=2,<3",
  "vtk>=9.5,<10",
]
